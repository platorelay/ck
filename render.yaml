services:
  - type: web
    name: rbx-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DISCORD_WEBHOOK
        sync: false
      - key: ALLOW_ORIGIN
        sync: false
      - key: CAPTCHA_KEY
        sync: false
